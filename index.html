const projVisible=p=>can('viewAll')||p.resps.includes(S.me)||(CPM[p.cp]&&CPM[p.cp].resp===S.me);
const projActive=p=>p.status==='В работе'||p.status==='Планируется';
const workOver=w=>!w.done&&w.due&&w.due<TODAY;
function projTabs(){const v=PROJECTS.filter(projVisible);return [{id:'active',label:'Активные',icon:'briefcase',count:v.filter(projActive).length},{id:'all',label:'Все',icon:'list'},{id:'mine',label:'Мои',icon:'user',count:v.filter(p=>p.resps.includes(S.me)&&projActive(p)).length}]}
function projAdd(){return can('projects')?[{label:'Проект',icon:'briefcase',run:()=>projectDlg()}]:[]}
function projCols(){const mv=moneyVis();return [
 {key:'name',label:'Проект',type:'text',w:280,val:p=>p.name,html:p=>`<span class="strong">${esc(p.name)}</span>`},
 {key:'cp',label:'Контрагент',type:'enum',w:210,val:p=>CPM[p.cp].name},
 {key:'status',label:'Статус',type:'enum',w:170,val:p=>p.status,html:p=>scaleMini('proj',p.status,p)+(projOver(p)?` <span class="pill red sm">${ic('alert')}срок прошёл</span>`:'')},
 {key:'from',label:'Начало',type:'date',w:110,val:p=>p.from},{key:'to',label:'Окончание',type:'date',w:120,val:p=>p.to,html:p=>`<span class="${projOver(p)?'red strong':''}">${fmtD(p.to)}</span>`},
 {key:'lead',label:'Главный',type:'enum',w:130,val:p=>empName(p.lead)},
 {key:'resps',label:'Ответственные',type:'text',w:190,val:p=>p.resps.map(empName).join(', '),hide:true},
 {key:'works',label:'Работы',type:'num',w:130,num:true,val:p=>p.works.length?p.works.filter(w=>w.done).length/p.works.length:0,html:p=>p.works.length?`${p.works.filter(w=>w.done).length} из ${p.works.length}${p.works.some(workOver)?` <span class="red" title="Есть работы с прошедшим сроком">${ic('alert','sm')}</span>`:''}`:'<span class="faint">—</span>'},
 {key:'nworks',label:'Работ всего',type:'int',w:110,num:true,val:p=>p.works.length,hide:true},
 {key:'pfiles',label:'Файлов',type:'int',w:90,num:true,val:p=>p.files.length,hide:true},
 {key:'tasks',label:'Задач открыто',type:'int',w:120,num:true,val:p=>TASKS.filter(t=>t.proj===p.id&&taskOpen(t)).length,hide:true},
 ...(mv?[{key:'plan',label:'Планируемая стоимость',type:'money',w:170,num:true,total:true,val:p=>p.plan||null,html:p=>p.plan?fmtM(p.plan):'<span class="faint">не задана</span>'},{key:'paid',label:'Получено',type:'money',w:130,num:true,total:true,val:projPaid},
   {key:'left',label:'Остаток',type:'money',w:130,num:true,total:true,val:p=>p.plan?projLeft(p):null,html:p=>!p.plan?'<span class="faint">—</span>':projLeft(p)>0?`<span class="strong">${fmtM(projLeft(p))}</span>`:'<span class="faint">0,00</span>'}]:[])]}
function setProjStatus(p,s){const o=p.status;p.status=s;log('p',p.id,`Статус: ${o} → ${s}`,p.cp);refreshAll();toast('Статус проекта: '+s)}
function projActions(p){const ed=can('projects');const it=[{label:'Открыть',icon:'briefcase',run:()=>openProject(p)}];
  if(ed)it.push({label:'Изменить',icon:'edit',run:()=>projectDlg(p)});
  if(ed&&moneyVis()&&p.status!=='Отменён')it.push({label:'Записать оплату',icon:'wallet',disabled:!!p.plan&&projLeft(p)<=0,reason:'Получена вся планируемая стоимость',run:()=>projPay(p)});
  if(feat('tasks')&&can('tasksCreate')&&p.status!=='Отменён')it.push({label:'Задача по проекту',icon:'task',run:()=>taskDlg(null,{cp:p.cp,proj:p.id,exec:p.lead})});
  if(ed){it.push({sep:true});['Планируется','В работе','Завершён','Отменён'].filter(s=>s!==p.status).forEach(s=>it.push({label:s==='Завершён'?'Завершить':s==='Отменён'?'Отменить проект':s==='В работе'?'В работу':'Вернуть в план',icon:PRS[s][1],danger:s==='Отменён',run:()=>setProjStatus(p,s)}))}
  it.push({label:'Карточка контрагента',icon:'building',run:()=>openCp(CPM[p.cp],'projects')});return it}
function renderProjects(body,tab,fresh){
  const v=PROJECTS.filter(projVisible);const run=v.filter(p=>p.status==='В работе'),plan=v.filter(p=>p.status==='Планируется'),over=v.filter(projOver);const left=v.filter(projActive).reduce((a,p)=>a+projLeft(p),0);
  body.innerHTML=`<div class="plates">${plate({id:'run',icon:'hourglass',color:'yellow',label:'В работе',value:run.length})}${plate({id:'plan',icon:'clock',color:'blue',label:'Планируются',value:plan.length})}${plate({id:'over',icon:'alert',color:over.length?'red':'green',label:'Срок прошёл',value:over.length,sub:over.length?'проект ещё в работе':'все в срок'})}${moneyVis()?plate({id:'left',icon:'wallet',color:'purple',label:'Осталось получить',value:fmtM(left,false),unit:'сом',sub:'по активным проектам с планом'}):''}</div><div id="pjg"></div>`;
  body.querySelector('.plates').onclick=e=>{const b=e.target.closest('[data-plate]');if(!b)return;const g=GS['proj-'+tab];if(!g)return;const k=b.dataset.plate;g.filters={};if(k==='run')g.filters.status={type:'enum',vals:['В работе']};if(k==='plan')g.filters.status={type:'enum',vals:['Планируется']};if(k==='over'){g.filters.status={type:'enum',vals:['В работе']};g.filters.to={type:'date',from:null,to:addDays(TODAY,-1)}}if(k==='left')g.filters.left={type:'num',from:1,to:null};g.page=0;renderPage()};
  const rows=()=>{const l=PROJECTS.filter(projVisible);if(tab==='active')return l.filter(projActive);if(tab==='mine')return l.filter(p=>p.resps.includes(S.me));return l};
  grid($('#pjg',body),{id:'proj-'+tab,cols:projCols(),rows,title:'name',noun:['проект','проекта','проектов'],sort:{key:'to',dir:1},rowClass:p=>projOver(p)?'overdue':p.status==='Отменён'||p.status==='Завершён'?'muted':'',preset:S.preset,simulateLoad:fresh,open:openProject,actions:projActions,
    empty:{icon:'briefcase',title:tab==='mine'?'Вы не ответственный ни в одном проекте':'Проектов пока нет',text:'Проект — разовая работа для контрагента за отдельную плату: восстановление учёта, постановка учёта, подготовка к проверке.',add:can('projects')&&tab!=='mine'?()=>projectDlg():null}});
}
function projPay(p){tranchDlg({title:'Оплата по проекту',sub:`${esc(p.name)} · ${esc(CPM[p.cp].name)}`,left:p.plan?projLeft(p):null,note:true,run:x=>{x.id=p.pays.length+1;p.pays.push(x);log('p',p.id,`Оплата ${som(x.amount)}${x.note?' ('+x.note+')':''}`,p.cp)}})}
function openProject(p){if(!p)return;
  openModal({size:'wide',live:true,render:m=>{const c=CPM[p.cp];const ed=can('projects');const mine=ed||p.resps.includes(S.me);const done=p.works.filter(w=>w.done).length;const ts=TASKS.filter(t=>t.proj===p.id).sort((a,b)=>a.date<b.date?-1:1);const mv=moneyVis();const paid=projPaid(p);
    return {title:esc(p.name),sub:`${esc(c.name)} · ${fmtD(p.from)} – ${fmtD(p.to)}`,body:`<div class="box"><div class="scales">${scaleFull('proj',p.status,p.id)}${projOver(p)?`<span class="pill red" style="align-self:center">${ic('alert')}срок окончания прошёл</span>`:''}</div></div>
    <div class="cols2"><div class="box"><div class="kv"><div><span class="k">Контрагент</span><span class="v"><button class="linkbtn" id="pj-cp">${esc(c.name)}</button></span></div><div><span class="k">Срок</span><span class="v">${fmtD(p.from)} – ${fmtD(p.to)}</span></div><div><span class="k">Главный ответственный</span><span class="v">${esc(empName(p.lead))}</span></div><div><span class="k">Ответственные</span><span class="v">${p.resps.map(e=>esc(empName(e))+(e===p.lead?' <span class="tag">главный</span>':'')).join(', ')}</span></div>${auditKv(p)}</div>${p.desc?`<p style="margin:0">${esc(p.desc)}</p>`:''}</div>
    ${mv?`<div class="box"><h3>Деньги по проекту</h3><div class="kv"><div><span class="k">Запланировано</span><span class="v tnum strong">${p.plan?som(p.plan):'<span class="faint">стоимость не задана</span>'}</span></div><div><span class="k">Получено</span><span class="v tnum">${som(paid)}</span></div><div><span class="k">Остаток</span><span class="v tnum ${p.plan&&projLeft(p)>0?'strong':''}">${p.plan?som(projLeft(p)):'—'}</span></div></div>${p.plan?`<div class="bar" role="progressbar" aria-valuenow="${paid}" aria-valuemax="${p.plan}"><i style="width:${Math.min(100,Math.round(paid/p.plan*100))}%"></i></div>`:''}</div>`:''}</div>
    <div class="box"><h3>Работы · ${done} из ${p.works.length}</h3>${p.works.length?`<div class="bar" role="progressbar" aria-valuenow="${done}" aria-valuemax="${p.works.length}"><i style="width:${Math.round(done/p.works.length*100)}%"></i></div>`:''}

/* ═════════════ Файловый менеджер ═════════════ */
function fsize(n){let h=7;for(const ch of n)h=(h*31+ch.charCodeAt(0))>>>0;return 38000+h%2400000}
function fmtSize(b){return b<1048576?Math.round(b/1024)+' КБ':(b/1048576).toFixed(1).replace('.',',')+' МБ'}
const fext=n=>{const i=n.lastIndexOf('.');return i>0?n.slice(i+1).toUpperCase():'ФАЙЛ'};
const FKIND={'Контрагент':'building','Отчёт':'file','Задача':'task','Поступление':'wallet','Разовая услуга':'coins','Проект':'briefcase','Загружен вручную':'upload'};
function allFiles(){const out=[];const vc=new Set(visCps(true).map(c=>c.id));const add=(o)=>{o.size=fsize(o.name);out.push(o)};
  CPS.forEach(c=>{if(!vc.has(c.id))return;(c.files||[]).forEach((n,i)=>add({id:`c${c.id}:${i}`,name:n,cp:c.id,kind:'Контрагент',src:'Карточка контрагента',date:(c._ua||c.start).slice(0,10),by:c._ub||c.resp,open:()=>openCp(c,'files')}))});
  REPORTS.forEach(r=>{if(!vc.has(r.cp)||!r.files.length)return;r.files.forEach((n,i)=>add({id:`r${r.id}:${i}`,name:n,cp:r.cp,kind:'Отчёт',src:`${T[r.t].short} · ${r.plabel}`,date:r.accDate||r.subDate||TODAY,by:r.resp,open:()=>openReport(r)}))});
  if(feat('tasks'))TASKS.forEach(t=>{if(!t.file||(t.cp&&!vc.has(t.cp)))return;add({id:`t${t.id}`,name:t.file,cp:t.cp,kind:'Задача',src:t.title,date:t.doneAt||t.created,by:t.exec,open:()=>openTask(t)})});
  if(taxVis())OPS.forEach(o=>{if(o.kind!=='in'||!vc.has(o.cp))return;(o.files||[]).forEach((n,i)=>add({id:`o${o.id}:${i}`,name:n,cp:o.cp,kind:'Поступление',src:`Поступление ${som(o.total??o.amount)} от ${fmtD(o.date)}`,date:o.date,by:o.by,open:()=>inCard(o)}))});
  SERVICES.forEach(s=>{if(!vc.has(s.cp))return;[...s.files,...s.pays.flatMap(p=>p.files||[])].forEach((n,i)=>add({id:`s${s.id}:${i}`,name:n,cp:s.cp,kind:'Разовая услуга',src:s.name,date:s.date,by:s.resp,open:()=>serviceCard(s)}))});
  PROJECTS.forEach(p=>{if(!vc.has(p.cp)||!projVisible(p))return;[...p.files,...p.pays.flatMap(x=>x.files||[])].forEach((n,i)=>add({id:`p${p.id}:${i}`,name:n,cp:p.cp,kind:'Проект',src:p.name,date:p.from,by:p.lead||p.resps[0],open:()=>openProject(p)}))});
  FILES.forEach(f=>{if(f.cp&&!vc.has(f.cp))return;add({id:f.id,name:f.name,cp:f.cp,kind:'Загружен вручную',src:f.folder||'Без папки',date:f.at,by:f.by,manual:f,open:null})});
  return out}

  body.innerHTML=`<div class="plates">${Object.keys(FKIND).filter(k=>k==='Загружен вручную'||all.some(f=>f.kind===k)).map(k=>plate({id:k,icon:FKIND[k],color:k==='Загружен вручную'?'purple':'blue',label:k==='Загружен вручную'?'Загружено вручную':k==='Контрагент'?'Карточки контрагентов':k==='Отчёт'?'К отчётам':k==='Задача'?'К задачам':k==='Поступление'?'К поступлениям':k==='Разовая услуга'?'К разовым услугам':'К проектам',value:all.filter(f=>f.kind===k).length})).join('')}</div><div id="flg"></div>`;

    bulk:[{label:'Скачать архивом',icon:'download',run:(rs,done)=>{toast(`Архив: ${rs.length} ${plural(rs.length,'файл','файла','файлов')}`,'download');done()}}],
    empty:{icon:'folder',title:'Файлов пока нет',add:()=>uploadDlg()}});
}
function openFile(f){if(!f)return;openModal({size:'mid',render:()=>({title:esc(f.name),sub:`${esc(f.kind)} · ${esc(f.src)}`,body:`<div class="box" style="align-items:center;justify-content:center;min-height:180px;text-align:center"><span style="transform:scale(2.2);display:inline-block;color:var(--muted)">${ic('file')}</span><b style="margin-top:12px">${fext(f.name)} · ${fmtSize(f.size)}</b><span class="hint">Предпросмотр PDF и картинок появится в рабочей версии</span></div>

  foot:`<button class="btn" id="fo-dl">${ic('download','sm')}Скачать</button><div class="grow"></div>${f.open?`<button class="btn cta" id="fo-src">${ic(FKIND[f.kind],'sm')}Перейти к источнику</button>`:'<button class="btn cta" data-close>Готово</button>'}`,

function uploadDlg(c0){openModal({form:true,render:()=>({title:'Загрузить файл',sub:'Файл появится в файловом менеджере с источником «Загружен вручную»',body:`<div class="form">${fld('Файлы',`<input class="inp" type="file" id="up-f" multiple>`,{req:true,full:true,id:'up-f'})}${fld('Контрагент',sel('up-cp',[['','— общий файл организации —'],...visCps().map(c=>[c.id,c.name])],c0?c0.id:''),{id:'up-cp',hint:'Файл контрагента виден и в его карточке'})}${fld('Папка',sel('up-fold',['Договоры','Учредительные документы','Шаблоны','Письма и запросы','Прочее'],'Договоры'),{id:'up-fold'})}${fld('Комментарий',inp('up-note',''),{full:true,id:'up-note'})}</div>`,

/* ═════════════ Аналитика: выручка по контрагентам ═════════════ */
const REV=[['fee','Обслуживание','var(--blue)'],['proj','Проекты','var(--purple)'],['svc','Разовые услуги','var(--orange)']];
function revenueData(y){const ys=String(y);const rows=visCps(true).map(c=>({c,fee:0,proj:0,svc:0,m:Array.from({length:12},()=>[0,0,0])}));const by={};rows.forEach(r=>by[r.c.id]=r);
  const add=(cp,date,k,a)=>{if(!date||!date.startsWith(ys))return;const r=by[cp];if(!r)return;r.m[+date.slice(5,7)-1][k]+=a;r[REV[k][0]]+=a};
  FEEPAYS.forEach(f=>add(f.cp,f.date,0,f.amount));PROJECTS.forEach(p=>p.pays.forEach(x=>add(p.cp,x.date,1,x.amount)));SERVICES.forEach(s=>s.pays.forEach(x=>add(s.cp,x.date,2,x.amount)));

/* Загрузка: вставка или файл → сравнение → «Применить» (со снимком для отката) */
function importDictDlg(k){const d=DX[k];const st={text:'',diff:null};
  const compare=()=>{const lines=st.text.split(/\r?\n/).filter(l=>l.trim());if(lines.length<2){st.diff={fatal:'Нужна строка заголовков и хотя бы одна строка данных'};return}
    const dl=lines[0].includes('\t')?'\t':';';const head=lines[0].split(dl).map(h=>norm(h.trim()));const idx=d.cols.map(c=>head.indexOf(norm(c[1])));
    if(idx[0]<0){st.diff={fatal:`Нет колонки «${d.cols[0][1]}»: без кода строки не сопоставить`};return}
    const seen=new Set();const out={add:[],chg:[],off:[],same:0,err:[],rows:lines.length-1};
    lines.slice(1).forEach((l,li)=>{const cells=l.split(dl).map(x=>x.trim());const v={},e=[];
      d.cols.forEach((c,ci)=>{if(idx[ci]<0)return;const r=c[3](cells[idx[ci]]??'');if(r&&typeof r==='object'&&r.err)e.push(r.err);else v[c[0]]=r});
      const code=v[d.cols[0][0]];if(!code)e.push('нет кода');else if(seen.has(code))e.push('код повторяется в файле');seen.add(code);
      if(e.length){out.err.push({n:li+2,code:code||'—',e});return}
      const x=d.items().find(i=>i[d.key]===code);
      if(!x){if(k==='types'&&!/^[a-z0-9_]+$/i.test(code)){out.err.push({n:li+2,code,e:['код вида — латиница и цифры']});return}out.add.push({code,v});return}
      const ch=[];d.cols.forEach((c,ci)=>{if(idx[ci]<0||ci===0)return;const nx=Object.assign({},x,v);if(c[0]==='after'||c[0]==='ym'){if((v.per||x.per)==='Y'?c[0]==='after':c[0]==='ym')return}const a=String(c[2](x)??''),b=String(c[2](nx)??'');if(a!==b)ch.push([c[1],a,b])});
      if(!ch.length){out.same++;return}
      const off=x.active&&v.active===false;(off?out.off:out.chg).push({code,x,v,ch})});
    if(k==='types'){const ids=new Set([...out.chg,...out.off].filter(r=>['per','day','after','ym'].some(f=>r.v[f]!=null&&r.v[f]!==r.x[f])).map(r=>r.code));out.dues=REPORTS.filter(r=>ids.has(r.t)&&OPEN.has(r.status)).length}
    st.diff=out};
  openModal({size:'wide',live:true,render:m=>{const df=st.diff;const ok=df&&!df.fatal;const n=ok?df.add.length+df.chg.length+df.off.length:0;
    const row=(cls,lbl,r,txt)=>`<tr><td><span class="pill sm ${cls}">${lbl}</span></td><td class="mono">${esc(r.code)}</td><td style="white-space:normal">${txt}</td></tr>`;
    return {title:`Загрузка: ${esc(d.title)}`,sub:'Вставьте строки из Excel или выберите файл в формате выгрузки',body:!df||df.fatal?`${fld('Данные',`<textarea class="inp mono" id="id-ta" style="min-height:220px;font-size:12px" placeholder="Вставьте строки с заголовками (Ctrl+V)">${esc(st.text)}</textarea>`,{full:true,id:'id-ta',hint:df&&df.fatal?'':`Колонки: ${d.cols.map(c=>c[1]).join(', ')}. Удаление через загрузку не делается — чтобы убрать значение, поставьте «Нет» в колонке «${d.cols[d.cols.length-1][1]}».`})}
      <div class="row"><label class="btn sm" style="cursor:pointer">${ic('upload','sm')}Файл Excel/CSV<input type="file" id="id-f" accept=".csv,.tsv,.txt" hidden></label><button class="linkbtn" id="id-cur">Подставить текущую выгрузку</button></div>`
      :`<div class="plates">${plate({id:'a',icon:'plus',color:'green',label:'Будет добавлено',value:df.add.length})}${plate({id:'c',icon:'edit',color:'blue',label:'Будет изменено',value:df.chg.length})}${plate({id:'o',icon:'ban',color:'orange',label:'Будет отключено',value:df.off.length})}${plate({id:'e',icon:'alert',color:df.err.length?'red':'green',label:'Строк с ошибками',value:df.err.length,sub:df.err.length?'не загрузятся':'ошибок нет'})}</div>
      ${df.dues?`<div class="note warn">${ic('alert')}<span>Изменятся сроки у ${df.dues} несданных ${plural(df.dues,'отчёта','отчётов','отчётов')} в 1 организации. Сданные отчёты не меняются.</span></div>`:''}
      <div class="tbl-wrap" style="max-height:340px;overflow:auto"><table class="mini"><thead><tr><th style="width:130px">Что будет</th><th style="width:110px">Код</th><th>Подробно</th></tr></thead><tbody>
      ${df.err.map(r=>`<tr><td><span class="pill sm red">${ic('alert')}ошибка</span></td><td class="mono">${esc(r.code)}</td><td style="white-space:normal">Строка ${r.n}: ${esc(r.e.join('; '))}</td></tr>`).join('')}

      ${df.off.map(r=>row('orange','отключится',r,esc(r.x.name)+(r.ch.length>1?'<br>'+r.ch.filter(c=>c[0]!==d.cols[d.cols.length-1][1]).map(([l,a,b])=>`${esc(l)}: ${esc(a)} → <b>${esc(b)}</b>`).join('<br>'):''))).join('')}
      ${!n&&!df.err.length?`<tr><td colspan="3" class="faint">Отличий нет: ${df.same} ${plural(df.same,'строка совпадает','строки совпадают','строк совпадают')} со справочником.</td></tr>`:''}
      </tbody></table></div><div class="hint">Без изменений: ${df.same}. Значения, которых нет в файле, остаются как есть — удаление через загрузку не делается.</div>`,
    foot:!df||df.fatal?`${df&&df.fatal?`<span class="red">${ic('alert','sm')} ${esc(df.fatal)}</span>`:''}<div class="grow"></div><button class="btn ghost" data-close>Отмена</button><button class="btn cta" id="id-cmp">Сравнить</button>`:`<button class="btn ghost" id="id-back">${ic('left','sm')}Изменить данные</button><div class="grow"></div><button class="btn ghost" data-close>Отмена</button><button class="btn cta" id="id-ok" ${n?'':'disabled'}>ОК, применить ${n||''}</button>`,
    mount(el){const q=s=>el.querySelector(s);

/* ═════════════ Показатели контрагентов ═════════════ */
// Indicators are the organisation's own setting (not a platform dictionary). One value per contractor × indicator × month;
// empty ≠ 0. Month status per contractor: Не заполнено → Заполнено (auto, all required filled) → Проверено (right «Проверять показатели»).
const KST={'Не заполнено':['orange','alert'],'Заполнено':['blue','check'],'Проверено':['green','ok']};
const IND=[],IVALS=[],KMS=[],IHIST=[];
let IV={},KMI={};
const KTYPES={int:'Целое число',dec:'Число с копейками',som:'Сумма в сом',pct:'Процент'};
const KAGG={sum:'Сумма',avg:'Среднее',max:'Максимум',min:'Минимум',last:'Последнее значение'};
const KUNITS=['сом','чел.','шт.','%'];
const MON_S=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
const ymS=k=>MON_S[+k.slice(5,7)-1]+' '+k.slice(2,4);
function kpiIndex(){IV={};IVALS.forEach(v=>IV[v.cp+'|'+v.ind+'|'+v.m]=v);KMI={};KMS.forEach(k=>KMI[k.id]=k)}
const kInds=all=>IND.filter(i=>all||!i.archived).sort((a,b)=>a.order-b.order);
const kApplies=(i,c,m)=>!i.archived&&c.kind!=='oneoff'&&!c.archived&&inService(c,m)&&(i.scope==='all'||(i.cps||[]).includes(c.id));
const kVal=(cp,ind,m)=>IV[cp+'|'+ind+'|'+m];
const kHasVals=i=>IVALS.some(v=>v.ind===i.id);
const kNum=(i,v)=>i.type==='int'?fmtM(v,false):fmtM(v,i.type==='dec'||(Math.round(v*100)%100)!==0);
const kFmt=(i,v)=>v==null||v===''?'':kNum(i,v)+(i.unit?' '+i.unit:'');
function kAgg(vals){const a=vals.filter(v=>v!=null);if(!a.length)return {n:0};const s=a.reduce((x,y)=>x+y,0);return {n:a.length,sum:s,avg:s/a.length,max:Math.max(...a),min:Math.min(...a),last:a[a.length-1]}}
const kMonths=(from,to)=>{const o=[];for(let x=from;x<=to;x=addMonths(x,1))o.push(x);return o};
const kPrev=()=>addMonths(ym(TODAY),-1);
const kCanEdit=c=>!isAdmin()&&(['owner','chief'].includes(me().role)||c.resp===S.me);
function kReq(c,m){const ap=kInds().filter(i=>kApplies(i,c,m));const rq=ap.filter(i=>i.req);return rq.length?rq:ap}
function kDue(c,m){const rq=kReq(c,m);const d=rq.length?Math.min(...rq.map(i=>i.dueDay||10)):10;const n=addMonths(m,1);return mkDate(+n.slice(0,4),+n.slice(5,7),d)}
function kMonth(c,m){const id=c.id+'|'+m;let k=KMI[id];if(k)return k;if(!kReq(c,m).length)return null;
  k={id,cp:c.id,m,name:`${c.name} · ${ymLabel(m)}`,status:'Не заполнено',_cb:'system',_ca:addMonths(m,1)+'-01 00:00'};KMS.push(k);KMI[id]=k;return k}
const kFilled=(c,m)=>{const rq=kReq(c,m);return rq.length>0&&rq.every(i=>kVal(c.id,i.id,m))};
function kSync(c,m,edited){const k=kMonth(c,m);if(!k)return null;const f=kFilled(c,m);let to=k.status;
  if(!f)to='Не заполнено';else if(k.status==='Не заполнено'||(edited&&k.status==='Проверено'))to='Заполнено';
  if(to!==k.status){log('km',k.id,`Статус: ${k.status} → ${to}${k.status==='Проверено'?' (значение изменено — нужна повторная проверка)':''}`,c.id);k.status=to}return k}
function kParse(i,txt){const t=String(txt).trim();if(t==='')return null;let n=parseNum(t.replace('%',''));if(isNaN(n))return NaN;if(i.type==='int')n=Math.round(n);else n=Math.round(n*100)/100;return n}
function kSet(c,i,m,v,note,file){const key=c.id+'|'+i.id+'|'+m;const old=IV[key];const ov=old?old.v:null;
  if(v==null){if(!old)return false;IVALS.splice(IVALS.indexOf(old),1);delete IV[key]}
  else if(old){if(old.v===v&&(note==null||note===old.note)&&!file)return false;old.v=v;if(note!=null)old.note=note;if(file)old.file=file;old.by=S.me;old.at=nowStamp()}
  else{const o={cp:c.id,ind:i.id,m,v,note:note||'',file:file||'',by:S.me,at:nowStamp()};IVALS.push(o);IV[key]=o}
  if(ov!==v){IHIST.push({cp:c.id,ind:i.id,m,old:ov,new:v,by:S.me,at:nowStamp()});log('kv',c.id+'|'+m,`Показатель «${i.name}», ${ymLabel(m)}: ${ov==null?'пусто':kFmt(i,ov)} → ${v==null?'пусто':kFmt(i,v)}`,c.id)}
  kSync(c,m,ov!==v);return true}
function kResync(){const last=kPrev();CPS.forEach(c=>kMonths(addMonths(last,-11),last).forEach(m=>{if(KMI[c.id+'|'+m]||kReq(c,m).length)kSync(c,m,false)}))}
function kpiSamples(){const add=o=>IND.push(Object.assign({id:'k'+(IND.length+1),unit:'',type:'int',desc:'',main:'sum',scope:'all',cps:[],req:true,dueDay:10,archived:false,order:IND.length+1,_cb:'system',_ca:ORG.created+' 11:00'},o));
  add({name:'Выручка',unit:'сом',type:'som',main:'sum',desc:'Выручка за месяц без НДС по данным учёта (оборот из декларации или книги продаж).'});
  add({name:'Количество сотрудников',unit:'чел.',type:'int',main:'avg',desc:'Численность на последний день месяца по штатному расписанию или отчёту в Соцфонд.'});return add}
function seedKpi(){const add=kpiSamples();IND.forEach(i=>i._cb='e1');
  add({name:'Фонд оплаты труда',unit:'сом',type:'som',main:'sum',req:false,_cb:'e2',desc:'Начисленная зарплата за месяц до удержаний.'});
  add({name:'Доля экспорта',unit:'%',type:'pct',main:'last',req:false,scope:'sel',cps:[CPS[11].id,CPS[19].id,CPS[20].id],_cb:'e2',desc:'Экспорт в процентах от выручки за месяц.'});
  const last=kPrev(),from=addMonths(last,-11);kpiIndex();
  CPS.forEach((c,ci)=>{if(c.kind==='oneoff'||c.archived)return;const base=rint(4,90)*100000,emp=rint(2,40);
    kMonths(from,last).forEach((m,mi)=>{if(!inService(c,m))return;const lag=(mi===11&&(ci%4===0||ci%7===1))||(mi===10&&ci%9===2);
      IND.forEach(i=>{if(!kApplies(i,c,m))return;if(lag&&(i.req||R()<.6))return;if(!i.req&&R()<.15)return;
        let v=i.id==='k1'?Math.round(base*(.7+R()*.6)/100)*100:i.id==='k2'?Math.max(1,emp+rint(-2,2)):i.id==='k3'?Math.round(emp*rint(25,60)*1000/100)*100:rint(10,70);
        if(i.id==='k1'&&ci===5&&mi===3)v=0;
        const at=`${addMonths(m,1)}-${String(rint(2,12)).padStart(2,'0')} ${String(rint(9,18)).padStart(2,'0')}:${rint(10,59)}`;IVALS.push({cp:c.id,ind:i.id,m,v,note:'',file:'',by:c.resp||'e2',at})})})});
  kpiIndex();
  CPS.forEach(c=>kMonths(from,last).forEach((m,mi)=>{const k=kMonth(c,m);if(!k)return;if(!kFilled(c,m))return;
    const at=kReq(c,m).map(i=>kVal(c.id,i.id,m).at).sort().pop();k.status='Заполнено';HIST.push({at,who:c.resp||'e2',ent:'km',id:k.id,cp:c.id,what:'Статус: Не заполнено → Заполнено'});
    if(mi<9){k.status='Проверено';HIST.push({at:`${addMonths(m,1)}-${rint(14,25)} 10:${rint(10,59)}`,who:'e2',ent:'km',id:k.id,cp:c.id,what:'Статус: Заполнено → Проверено'})}}))}
const kCps=m=>visCps().filter(c=>c.kind!=='oneoff'&&kReq(c,m).length);
function kStats(m){const cs=kCps(m);const st=cs.map(c=>(kMonth(c,m)||{}).status);const due=c=>kDue(c,m);
  return {all:cs.length,filled:st.filter(x=>x==='Заполнено'||x==='Проверено').length,empty:st.filter(x=>x==='Не заполнено').length,over:cs.filter((c,j)=>st[j]==='Не заполнено'&&TODAY>due(c)).length,checked:st.filter(x=>x==='Проверено').length}}
function kMissing(){const last=kPrev(),out=[];visCps().forEach(c=>kMonths(addMonths(last,-11),last).forEach(m=>{const rq=kInds().filter(i=>i.req&&kApplies(i,c,m));const miss=rq.filter(i=>!kVal(c.id,i.id,m));if(!miss.length)return;const due=kDue(c,m);out.push({id:c.id+'|'+m,c,m,miss,due,over:TODAY>due?diffDays(TODAY,due):0,k:kMonth(c,m)})}));return out}
function kpiTabs(){return [{id:'month',label:'Ввод за месяц',icon:'edit'},{id:'period',label:'За период',icon:'chart'},{id:'missing',label:'Не заполнено',icon:'alert',count:kMissing().length,red:true},can('indSetup')?{id:'setup',label:'Настройка показателей',icon:'sliders'}:null]}
function kpiAdd(){return can('indSetup')?[{label:'Показатель',icon:'gauge',run:()=>indDlg()}]:[]}
function kPlates(m){const s=kStats(m);return `<div class="plates">${plate({id:'kf',icon:'check',color:'blue',label:`Заполнено за ${MONTHS[+m.slice(5,7)-1]}`,value:`${s.filled} из ${s.all}`,sub:'контрагентов с внесёнными показателями'})}${plate({id:'ke',icon:'alert',color:s.empty?'orange':'green',label:'Не заполнено',value:s.empty,sub:s.empty?'нет обязательных значений':'всё внесено'})}${plate({id:'ko',icon:'clock',color:s.over?'red':'green',label:'Просрочено заполнение',value:s.over,sub:'срок заполнения прошёл'})}${plate({id:'kc',icon:'ok',color:'green',label:'Проверено',value:s.checked,sub:'главным бухгалтером или владельцем'})}</div>`}
function kPeriodBar(p,id){const y=+TODAY.slice(0,4),last=kPrev();const q0=addMonths(ym(TODAY),-((+TODAY.slice(5,7)-1)%3));
  const qs=[['year',`${y}-01`,`${y}-12`,'Этот год'],['prev',`${y-1}-01`,`${y-1}-12`,'Прошлый год'],['12',addMonths(last,-11),last,'Последние 12 месяцев'],['q',q0,addMonths(q0,2),'Квартал']];
  return `<div class="row kpi-bar"><label class="row" style="gap:6px"><span class="muted">С</span><input type="month" class="inp" id="${id}-f" value="${p.from}" style="width:auto;min-height:32px;padding:3px 8px"></label><label class="row" style="gap:6px"><span class="muted">по</span><input type="month" class="inp" id="${id}-t" value="${p.to}" style="width:auto;min-height:32px;padding:3px 8px"></label><div class="seg">${qs.map(q=>`<button data-kq="${q[1]}|${q[2]}" class="${p.from===q[1]&&p.to===q[2]?'on':''}">${q[3]}</button>`).join('')}</div></div>`}
function kBindPeriod(root,id,p,redraw){const f=root.querySelector('#'+id+'-f'),t=root.querySelector('#'+id+'-t');
  const set=(a,b)=>{if(!a||!b)return;if(a>b)[a,b]=[b,a];p.from=a;p.to=b;redraw()};f.onchange=()=>set(f.value,t.value);t.onchange=()=>set(f.value,t.value);
  root.querySelectorAll('[data-kq]').forEach(b=>b.onclick=()=>{const[a,c]=b.dataset.kq.split('|');set(a,c)})}

function renderKpi(body,tab,fresh){
  S.kpiM=S.kpiM||kPrev();S.kpiP=S.kpiP||{from:addMonths(kPrev(),-11),to:kPrev()};
  if(tab==='setup')return kpiSetup(body);
  if(!visCps().length){const fe=firstEmpty();body.innerHTML=fe?feHtml(fe):'';body.onclick=e=>{const b=e.target.closest('[data-a=fe]');if(b)fe.btns.filter(Boolean)[+b.dataset.i][2]()};return}
  if(tab==='month')return kpiMonth(body);
  if(tab==='period')return kpiPeriod(body,fresh);
  if(tab==='missing')return kpiMissingTab(body,fresh);
}
// «Ввод за месяц»: Excel-like grid; arrows/Enter move between cells, a block pasted from Excel fills cells from the focused one.
function kpiMonth(body){const m=S.kpiM;const inds=kInds();const q=norm(S.search.trim());
  const cs=kCps(m).filter(c=>!q||norm(c.name).includes(q)||norm(empName(c.resp)).includes(q)).sort((a,b)=>COLL.compare(a.name,b.name));
  let h=kPlates(m)+`<div class="row kpi-bar"><label class="row" style="gap:6px"><span class="muted">Месяц</span><input type="month" class="inp" id="km-m" value="${m}" max="${ym(TODAY)}" style="width:auto;min-height:32px;padding:3px 8px"></label><span class="hint" style="margin:0">Внесите значения за месяц после его окончания. Пусто — «не заполнено», 0 — «внесено, равно нулю». Можно вставить блок из Excel.</span></div>`;
  if(!inds.length){body.innerHTML=h+`<div class="state">${ic('gauge','lg')}<b>Показателей нет</b><span>Создайте показатели во вкладке «Настройка показателей».</span></div>`;return}
  if(!cs.length){body.innerHTML=h+`<div class="state">${ic('search','lg')}<b>Ничего не найдено</b><span>Нет контрагентов, для которых нужны показатели за ${esc(ymLabel(m))}.</span></div>`;bindM();return}
  if(isMobile()){h+=`<div class="gcards">${cs.map(c=>{const k=kMonth(c,m);const ap=inds.filter(i=>kApplies(i,c,m));const n=ap.filter(i=>kVal(c.id,i.id,m)).length;
      return `<button class="gcard kcard ${k&&k.status==='Не заполнено'&&TODAY>kDue(c,m)?'overdue':''}" data-kmc="${c.id}"><div class="row" style="flex-wrap:nowrap"><b class="grow" style="text-align:left">${esc(c.name)}</b>${ic('right','sm')}</div><dl><dt>Внесено</dt><dd>${n} из ${ap.length}</dd><dt>Ответственный</dt><dd>${esc(empName(c.resp)||'—')}</dd><dt>Статус</dt><dd>${k?scaleMini('ind',k.status,k):'—'}</dd></dl></button>`}).join('')}</div>`;
    body.innerHTML=h;bindM();body.onclick=e=>{const b=e.target.closest('[data-kmc]');if(b)kEditDlg(CPM[+b.dataset.kmc],m)};return}
  h+=`<div class="tbl-wrap kpi-wrap"><table class="kt"><thead><tr><th class="kt-cp">Контрагент</th><th>Ответственный</th>${inds.map(i=>`<th class="num">${esc(i.name)}${i.desc?tipI(i.desc):''}<small>${esc(i.unit||KTYPES[i.type])}${i.req?'':' · необязательный'}</small></th>`).join('')}<th>Статус месяца</th></tr></thead><tbody>`;
  cs.forEach((c,ri)=>{const k=kMonth(c,m);const ed=kCanEdit(c);const ov=k&&k.status==='Не заполнено'&&TODAY>kDue(c,m);
    h+=`<tr class="${ov?'overdue':''}" data-kr="${c.id}"><td class="kt-cp"><button class="linkbtn" data-kcp="${c.id}">${esc(c.name)}</button></td><td class="muted">${esc(empName(c.resp)||'—')}</td>${inds.map((i,ci)=>{if(!kApplies(i,c,m))return '<td class="num faint" title="Показатель не нужен этому контрагенту">—</td>';const v=kVal(c.id,i.id,m);
      return `<td class="num ${v?'':i.req?'emp':''}"><input class="kin" data-r="${ri}" data-c="${ci}" data-cp="${c.id}" data-ind="${i.id}" value="${v?esc(kNum(i,v.v)):''}" ${ed?'':'readonly title="Вносит ответственный, главный бухгалтер или владелец"'} inputmode="decimal" aria-label="${esc(c.name)}: ${esc(i.name)}"></td>`}).join('')}<td class="kst">${k?scaleMini('ind',k.status,k):'—'}</td></tr>`});
  h+=`</tbody><tfoot>${[['sum','Сумма'],['avg','Среднее'],['max','Максимум'],['min','Минимум']].map(([a,l])=>`<tr><th colspan="2">${l}</th>${inds.map(i=>`<td class="num" data-kf="${i.id}" data-a="${a}"></td>`).join('')}<td></td></tr>`).join('')}</tfoot></table></div>`;
  body.innerHTML=h;bindM();foot();

      inds.filter(i=>!i.archived).forEach(i=>{const v=kParse(i,val(el,'kv-'+i.id));if(Number.isNaN(v)){setErr(el,'kv-'+i.id,'Введите число');bad=true;return}setErr(el,'kv-'+i.id,'');
        const f=el.querySelector('#kf-'+i.id);const fn=f&&f.files&&f.files[0]?f.files[0].name:'';if(v==null&&!kVal(c.id,i.id,m))return;if(kSet(c,i,m,v,val(el,'kn-'+i.id),fn))n++});
      if(bad)return;mm.close();refreshAll();toast(n?`Сохранено: ${n}`:'Изменений нет')}}}}})}
// Card tab «Показатели»: table indicator × month + totals, inline entry, chart of the chosen indicator.
function kpiCardHtml(c,st){const y=+TODAY.slice(0,4);st.kp=st.kp||{from:`${y}-01`,to:`${y}-12`};const p=st.kp;const ms=kMonths(p.from,p.to);
  const inds=kInds(true).filter(i=>ms.some(m=>kApplies(i,c,m)||kVal(c.id,i.id,m)));const ed=kCanEdit(c);st.kch=st.kch&&inds.find(i=>i.id===st.kch)?st.kch:(inds[0]||{}).id;
  if(!inds.length)return kPeriodBar(p,'kcp')+`<div class="state">${ic('gauge','lg')}<b>Показателей за этот период нет</b><span>${c.paused||c.archived?'Обслуживание приостановлено или контрагент в архиве.':'Показатели настраиваются в модуле «Показатели контрагентов».'}</span></div>`;
  const row=i=>{const vals=ms.map(m=>{const v=kVal(c.id,i.id,m);return v?v.v:null});return {vals,g:kAgg(vals),need:ms.filter(m=>kApplies(i,c,m)).length}};
  const cell=(i,m)=>{const v=kVal(c.id,i.id,m);const ap=kApplies(i,c,m);const emp=!v&&ap&&m<ym(TODAY);
    if(ed&&!i.archived&&(ap||v)&&m<=ym(TODAY))return `<td class="num ${emp?'emp':''}"><input class="kin kin-c" data-ind="${i.id}" data-m="${m}" value="${v?esc(kNum(i,v.v)):''}" inputmode="decimal" aria-label="${esc(i.name)}, ${esc(ymLabel(m))}"></td>`;
    return `<td class="num ${emp?'emp':''}">${v?esc(kNum(i,v.v)):ap&&m<ym(TODAY)?'<span class="faint">пусто</span>':'<span class="faint">—</span>'}</td>`};
  const tots=(i,r)=>['sum','avg','max','min'].map(a=>`<td class="num ktot ${a===i.main?'strong':''}">${r.g.n?esc(kNum(i,a==='avg'?Math.round(r.g.avg*100)/100:r.g[a])):'—'}${a==='avg'&&r.g.n?`<small class="faint"> по ${r.g.n} из ${r.need||ms.length}</small>`:''}</td>`).join('');
  let h=kPeriodBar(p,'kcp')+`<div class="hint" style="margin:0">Итоги считаются только по заполненным месяцам. Незаполненные месяцы подсвечены.</div>`;
  if(isMobile()){h+=inds.map(i=>{const r=row(i);return `<div class="box kcard-i"><div class="row"><b class="grow">${esc(i.name)}</b>${i.desc?tipI(i.desc):''}<span class="tag">${esc(i.unit||'—')}</span></div>
      <div class="ktots">${['sum','avg','max','min'].map(a=>`<span class="${a===i.main?'on':''}"><small>${KAGG[a]}</small><b>${r.g.n?esc(kNum(i,a==='avg'?Math.round(r.g.avg*100)/100:r.g[a])):'—'}</b></span>`).join('')}</div>
      <table class="mini kmlist"><tbody>${ms.map(m=>`<tr><td>${esc(ymLabel(m))}</td>${cell(i,m)}</tr>`).join('')}</tbody></table></div>`}).join('');return h}
  h+=`<div class="tbl-wrap kpi-wrap"><table class="kt kt-card"><thead><tr><th class="kt-cp">Показатель</th>${['sum','avg','max','min'].map(a=>`<th class="num ktot-h">${KAGG[a]}</th>`).join('')}${ms.map(m=>`<th class="num">${ymS(m)}</th>`).join('')}</tr></thead><tbody>
    ${inds.map(i=>{const r=row(i);return `<tr class="${st.kch===i.id?'sel':''}"><td class="kt-cp"><button class="linkbtn" data-kch="${i.id}" title="Показать на графике">${esc(i.name)}</button>${i.desc?tipI(i.desc):''}<small class="faint"> ${esc(i.unit||'')}</small></td>${tots(i,r)}${ms.map(m=>cell(i,m)).join('')}</tr>`}).join('')}</tbody></table></div>`;
  const ci=inds.find(i=>i.id===st.kch);if(ci){const r=row(ci);const mx=Math.max(1,...r.vals.filter(v=>v!=null).map(Math.abs));const W=Math.max(320,ms.length*56),H=170;const bw=Math.min(36,W/ms.length-14);
    h+=`<div class="box"><h3>${esc(ci.name)} по месяцам<span class="grow"></span><span class="chk-n">${KAGG[ci.main]}: ${r.g.n?esc(kFmt(ci,ci.main==='avg'?Math.round(r.g.avg*100)/100:r.g[ci.main])):'—'}</span></h3><div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="График «${esc(ci.name)}»" style="min-width:${Math.min(W,560)}px;display:block">
      <line x1="0" x2="${W}" y1="${H-24}" y2="${H-24}" stroke="var(--border)"/>${ms.map((m,j)=>{const v=r.vals[j];const x=j*(W/ms.length)+(W/ms.length-bw)/2;const bh=v==null?0:Math.max(2,Math.abs(v)/mx*(H-50));
        return `<g><title>${esc(ymLabel(m))}: ${v==null?'не заполнено':esc(kFmt(ci,v))}</title>${v==null?`<rect x="${x}" y="${H-28}" width="${bw}" height="4" rx="2" fill="var(--border-strong)"/>`:`<rect x="${x}" y="${H-24-bh}" width="${bw}" height="${bh}" rx="4" fill="var(--b-blue)"/>`}<text x="${x+bw/2}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--faint)">${ymS(m).split(' ')[0]}</text></g>`}).join('')}</svg></div><div class="hint" style="margin:0">Серые отметки — месяцы без значения: в итоги они не входят.</div></div>`}
  return h}
function kpiCardMount(el,c,st,mm){kBindPeriod(el,'kcp',st.kp,()=>mm.draw());
  $$('[data-kch]',el).forEach(b=>b.onclick=()=>{st.kch=b.dataset.kch;mm.draw()});
  $$('.kin-c',el).forEach(x=>{x.addEventListener('focus',()=>x.select());x.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();x.blur()}});
    x.addEventListener('change',()=>{const i=IND.find(y=>y.id===x.dataset.ind),m=x.dataset.m;const v=kParse(i,x.value);if(Number.isNaN(v)){toast(`«${x.value}» — не число`,'alert',true);const o=kVal(c.id,i.id,m);x.value=o?kNum(i,o.v):'';return}
      if(kSet(c,i,m,v)){derive();mm.draw();toast('Сохранено')}})})}

/* ═════════════ Start ═════════════ */
function seedAudit(){
  const tm=()=>String(rint(8,18)).padStart(2,'0')+':'+String(rint(0,59)).padStart(2,'0');
  const fix=o=>{if(!o._ub)o._ub=o._cb;if(!o._ua||o._ua<o._ca)o._ua=o._ca};
  const last={};HIST.forEach(h=>{const k=h.ent+':'+h.id;if(!last[k]||h.at>last[k].at)last[k]=h;if(h.cp!=null){const k2='cp:'+h.cp;if(h.ent==='cp'&&(!last[k2]||h.at>last[k2].at))last[k2]=h}});
  CPS.forEach(c=>{c._cb=pick(['e1','e2']);c._ca=c.start+' '+tm();const h=last['cp:'+c.id];if(h){c._ub=h.who;c._ua=h.at}else{c._ub=pick([c._cb,c.resp||'e2']);c._ua=minIso(addDays(c.start,rint(0,Math.max(0,diffDays(TODAY,c.start)))),TODAY)+' '+tm()}fix(c)});
  REPORTS.forEach(r=>{const c=CPM[r.cp];r._cb='system';r._ca=minIso(maxIso(addDays(r.pkey,-31),c.start),TODAY)+' 03:00';const h=last['r:'+r.id];if(h){r._ub=h.who;r._ua=h.at}else{r._ub='system';r._ua=r._ca}fix(r)});
  TASKS.forEach(t=>{t._cb=t.by;t._ca=t.created+' '+tm();if(t.status!=='К выполнению'){t._ub=t.exec;t._ua=(t.doneAt||minIso(addDays(t.created,rint(1,3)),TODAY))+' '+tm()}fix(t)});
  EMP.forEach(e=>{e._cb=e.id==='e1'?'admin':'e1';e._ca=(e.id==='e1'?ORG.created:addDays(ORG.created,rint(1,200)))+' '+tm();if(e.id==='e7'){e._ub='e1';e._ua='2026-06-12 18:04'}else if(e.role==='acc'&&e.id!=='e5'){e._ub=e.id;e._ua=minIso(addDays(TODAY,-rint(5,60)),TODAY)+' '+tm()}fix(e)});
  RT.forEach(t=>{t._cb='admin';t._ca='2025-01-15 10:'+String(rint(10,59));if(t.code==='STI-129'){t._ub='admin';t._ua='2026-08-28 15:40'}fix(t)});
  Object.values(DICT).forEach(d=>d.items.forEach(x=>{x._cb='admin';x._ca='2025-01-15 09:'+String(rint(10,59));fix(x)}));
  PHONES.forEach(p=>{p._cb='admin';p._ca='2025-01-15 09:05';fix(p)});
  Object.entries(ORG.types).forEach(([k,o])=>{o._cb='e1';o._ca=ORG.created+' 11:20';if(k==='nds'){o._ub='e1';o._ua='2026-03-10 10:05'}fix(o)});
  PROJECTS.forEach(p=>{p._cb=p._cb||'e1';p._ca=p._ca||(minIso(addDays(p.from,-5),TODAY)+' '+tm());fix(p)});
  SERVICES.forEach(s=>{s._cb=s._cb||s.resp||'e2';s._ca=s._ca||(s.date+' '+tm());fix(s)});
  FILES.forEach(f=>{f._cb=f._cb||f.by;f._ca=f._ca||(f.at+' '+tm());fix(f)});
  ORGS.forEach(o=>{o._cb='admin';o._ca=o.created+' '+tm();if(!o.active){o._ub='admin';o._ua='2026-09-01 09:00'}fix(o)});
  OTHER_USERS.forEach(u=>{const org=ORGS.find(o=>o.id===u.org);u._cb=u.role==='Владелец организации'?'admin':org.owner;u._ca=addDays(org.created,u._cb==='admin'?0:rint(1,40))+' '+tm();fix(u)});
  L10N.forEach(x=>{x._cb='admin';x._ca='2025-01-15 12:00';fix(x)});
  REQUESTS.forEach(r=>{r._cb=r._cb||'b.toktomamatov';r._ca=r._ca||r.at+' 14:22';fix(r)});
  OPS.forEach(o=>{o._ca=o.date+' '+tm()});
}
function emptyOrg(){
  [CPS,REPORTS,OPS,HIST,TASKS,FEEPAYS,SERVICES,PROJECTS,FILES].forEach(a=>a.length=0);Object.keys(CPM).forEach(k=>delete CPM[k]);
  EMP.splice(1);Object.keys(EM).forEach(k=>{if(k!=='e1')delete EM[k]});Object.assign(EMP[0],{tg:null,wallets:[],lastIn:'сейчас'});
  Object.values(ORG.types).forEach(t=>t.on=false);Object.assign(ORG,{address:'',head:'',accounts:[],created:TODAY});
  [IND,IVALS,KMS,IHIST].forEach(a=>a.length=0);kpiSamples();kpiIndex();
}
const DATA_KEYS={CPS,REPORTS,OPS,HIST,TASKS,FEEPAYS,SERVICES,PROJECTS,FILES,EMP,IND,IVALS,KMS,IHIST};let SNAP=null;
// Switches demo/empty data in place (no reload): restore the seeded snapshot, then empty it if asked.
function setDataMode(v){DATA_MODE=v;store.set('data',v);
  Object.entries(DATA_KEYS).forEach(([k,a])=>{a.length=0;a.push(...structuredClone(SNAP[k]))});
  Object.keys(CPM).forEach(k=>delete CPM[k]);CPS.forEach(c=>CPM[c.id]=c);Object.keys(EM).forEach(k=>delete EM[k]);EMP.forEach(e=>EM[e.id]=e);
  Object.keys(ORG).forEach(k=>delete ORG[k]);Object.assign(ORG,structuredClone(SNAP.ORG));
  ckReset();if(v==='empty'){emptyOrg();store.set('tour.e1',null);store.set('chk.hidden',false)}derive();ckBase();
  MODALS.slice().forEach(m=>m.close());closeSheet();closePop();if(TOUR.on){TOUR.on=false;$('#tour').hidden=true}
  Object.keys(TAB_SCROLL).forEach(k=>delete TAB_SCROLL[k]);S.me='e1';S.mod=null;S.tab=null;derive();
  if(location.hash==='#home.today')route();else location.hash='#home.today';
  toast(v==='empty'?'Пустая организация: как сразу после регистрации':'Включены демо-данные','refresh');
  if(v==='empty')setTimeout(()=>tourStart('full',0),600)}
seed();seedKpi();seedAudit();SNAP=structuredClone({...DATA_KEYS,ORG});if(DATA_MODE==='empty')emptyOrg();derive();initTop();
if(!location.hash||location.hash==='#')history.replaceState(null,'','#home');
route();ckBase();ckBar();
if(DATA_MODE==='empty'&&!(store.get('tour.e1',null)||{}).done)setTimeout(()=>tourStart('full',(store.get('tour.e1',null)||{}).i||0),700);
</script>
